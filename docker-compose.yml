services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: keyflow
      POSTGRES_PASSWORD: keyflow
      POSTGRES_DB: keyflow
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyflow -d keyflow"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
