name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-race:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keyflow
          POSTGRES_PASSWORD: keyflow
          POSTGRES_DB: keyflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyflow -d keyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Типы
        run: |
          npm run typecheck -w server
          npm run typecheck -w providers
          npm run typecheck -w web

      - name: Сборка фронта
        run: npm run build -w web

      # Тесты сами поднимают API и заглушки поставщиков и создают базу
      # keyflow_test — снаружи нужен только живой Postgres.
      - name: Тесты гонок
        run: npm run test:races
        env:
          TEST_PG_URL: postgres://keyflow:keyflow@localhost:5432

  deploy:
    needs: build-and-race
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Ключ прописан на сервере с forced command: он умеет запустить только
      # /srv/keyflow/deploy.sh, шелла и портфорвардинга не даёт.
      # Сам деплой ходит под непривилегированным пользователем keyflow,
      # sudo разрешён ровно на рестарт двух юнитов.
      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Деплой
        run: ssh -i ~/.ssh/deploy_key keyflow@${{ secrets.DEPLOY_HOST }}
